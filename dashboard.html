<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>MC From — Admin (Permanent CDN)</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#080808;--s1:#0f0f0f;--s2:#161616;--s3:#1e1e1e;--ac:#00e676;--gold:#ffd740;--red:#ff4444;--text:#eee;--muted:#666;--border:#222}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--text);font-family:'Rajdhani',sans-serif;min-height:100vh;overflow-x:hidden}
#login{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:100;gap:20px}
#login.hide{display:none}
.login-logo{font-family:'Press Start 2P',monospace;font-size:18px;color:var(--ac);text-shadow:0 0 30px var(--ac);letter-spacing:2px}
.login-box{background:var(--s2);border:1px solid var(--border);border-radius:14px;padding:28px 24px;width:min(340px,90vw);display:flex;flex-direction:column;gap:14px}
.login-box h2{font-family:'Press Start 2P',monospace;font-size:9px;color:var(--ac);text-align:center;line-height:1.8}
.inp{background:var(--s3);border:1px solid var(--border);border-radius:8px;padding:12px 14px;color:var(--text);font-family:'Rajdhani',sans-serif;font-size:15px;font-weight:600;outline:none;transition:border-color .2s;width:100%}
.inp:focus{border-color:var(--ac)}
.btn{background:var(--ac);color:#000;font-family:'Press Start 2P',monospace;font-size:8px;border:none;border-radius:8px;padding:13px;cursor:pointer;letter-spacing:.5px;transition:opacity .2s;width:100%}
.btn:hover{opacity:.9}
.btn:disabled{opacity:.4;cursor:not-allowed}
.err{color:var(--red);font-family:'VT323',monospace;font-size:18px;text-align:center;display:none}
.err.show{display:block}
#app{display:none}#app.show{display:block}
.topbar{background:var(--s1);border-bottom:1px solid var(--border);padding:0 20px;height:56px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50}
.topbar-brand{font-family:'Press Start 2P',monospace;font-size:9px;color:var(--ac);letter-spacing:1px}
.topbar-right{display:flex;align-items:center;gap:10px}
.stat-chip{background:var(--s3);border:1px solid var(--border);border-radius:20px;padding:4px 12px;font-family:'VT323',monospace;font-size:18px;color:var(--muted)}
.stat-chip span{color:var(--ac)}
.logout-btn{background:transparent;border:1px solid var(--border);color:var(--muted);font-size:13px;font-weight:700;padding:6px 12px;border-radius:8px;cursor:pointer}
.logout-btn:hover{border-color:var(--red);color:var(--red)}
.tabs{display:flex;border-bottom:1px solid var(--border);background:var(--s1);padding:0 20px;overflow-x:auto}
.tab{flex-shrink:0;padding:14px 16px;font-size:13px;font-weight:700;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;transition:all .2s;white-space:nowrap}
.tab.on{color:var(--ac);border-bottom-color:var(--ac)}
.content{padding:20px;max-width:900px;margin:0 auto}
.section{display:none}.section.on{display:block}
.mods-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px;margin-top:4px}
.mod-card{background:var(--s2);border:1px solid var(--border);border-radius:12px;overflow:hidden}
.mod-card:hover{border-color:var(--ac)}
.mod-card-img{width:100%;height:130px;object-fit:cover;display:block;background:var(--s3)}
.mod-card-body{padding:12px}
.mod-card-name{font-family:'VT323',monospace;font-size:20px;margin-bottom:6px}
.mod-card-meta{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.tag{background:var(--s3);border:1px solid var(--border);border-radius:4px;padding:2px 7px;font-size:11px;color:var(--muted);font-weight:700}
.mod-actions{display:flex;gap:6px}
.ic-btn{flex:1;background:var(--s3);border:1px solid var(--border);border-radius:6px;padding:7px;font-size:12px;cursor:pointer;color:var(--muted);font-weight:700;transition:all .2s;text-align:center}
.ic-btn:hover{border-color:var(--ac);color:var(--ac)}
.ic-btn.del:hover{border-color:var(--red);color:var(--red)}
.empty{grid-column:1/-1;text-align:center;padding:60px 20px;color:var(--muted)}
.form-box{background:var(--s2);border:1px solid var(--border);border-radius:14px;padding:24px;display:flex;flex-direction:column;gap:16px;max-width:580px}
.form-box h2{font-family:'Press Start 2P',monospace;font-size:8px;color:var(--ac);line-height:1.8}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
.form-row{display:flex;gap:10px}
.form-row .field{flex:1}
.img-preview{width:100%;max-height:200px;object-fit:cover;border-radius:8px;display:none;margin-top:8px;border:1px solid var(--border)}
.img-preview.show{display:block}
.status-bar{font-family:'VT323',monospace;font-size:18px;color:var(--ac);display:none;padding:8px 12px;background:var(--s3);border-radius:6px}
.status-bar.show{display:block}
.status-bar.err{color:var(--red)}
.settings-box{background:var(--s2);border:1px solid var(--border);border-radius:14px;padding:24px;max-width:500px;display:flex;flex-direction:column;gap:16px}
.settings-box h2{font-family:'Press Start 2P',monospace;font-size:8px;color:var(--ac);line-height:1.8}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:200;display:none;align-items:center;justify-content:center;padding:16px}
.overlay.show{display:flex}
.modal{background:var(--s2);border:1px solid var(--border);border-radius:14px;padding:24px;width:min(480px,100%);display:flex;flex-direction:column;gap:16px;max-height:90vh;overflow-y:auto}
.modal h3{font-family:'Press Start 2P',monospace;font-size:8px;color:var(--ac);line-height:1.8}
.modal-actions{display:flex;gap:8px}
.modal-actions .btn{flex:1}
#toast{position:fixed;bottom:20px;right:20px;z-index:9000;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.toast-item{background:var(--s2);border:1px solid var(--ac);border-radius:8px;padding:10px 16px;font-family:'VT323',monospace;font-size:18px;color:var(--ac);animation:slideIn .3s ease}
@keyframes slideIn{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:translateX(0)}}
.loading-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:300;display:none;align-items:center;justify-content:center}
.loading-overlay.show{display:flex}
.loading-spinner{font-family:'Press Start 2P',monospace;font-size:10px;color:var(--ac)}
</style>
</head>
<body>

<div id="login">
  <div class="login-logo">MC FROM</div>
  <div class="login-box">
    <h2>ENTER PASSWORD</h2>
    <input class="inp" type="password" id="pw-input" placeholder="Password..." onkeydown="if(event.key==='Enter')doLogin()">
    <button class="btn" onclick="doLogin()">🔓 LOGIN</button>
    <div class="err" id="login-err">❌ Wrong password!</div>
  </div>
</div>

<div id="app">
  <div class="topbar">
    <div class="topbar-brand">⚡ MC FROM ADMIN</div>
    <div class="topbar-right">
      <div class="stat-chip">Mods: <span id="stat-mods">0</span></div>
      <button class="logout-btn" onclick="logout()">Logout</button>
    </div>
  </div>

  <div class="tabs">
    <div class="tab on" onclick="showTab('addons',this)">📦 Add-ons</div>
    <div class="tab" onclick="showTab('pass',this)">💎 Pass</div>
    <div class="tab" onclick="showTab('add',this)">➕ Add Mod</div>
    <div class="tab" onclick="showTab('settings',this)">⚙️ Settings</div>
  </div>

  <div class="content">
    <div class="section on" id="sec-addons">
      <div class="mods-grid" id="grid-addons"></div>
    </div>
    <div class="section" id="sec-pass">
      <div class="mods-grid" id="grid-pass"></div>
    </div>
    <div class="section" id="sec-add">
      <div class="form-box">
        <h2>ADD NEW MOD</h2>
        <div class="field">
          <label>Mod Name *</label>
          <input class="inp" id="f-name" type="text" placeholder="e.g. Modern Furniture">
        </div>
        <div class="field">
          <label>Description</label>
          <textarea class="inp" id="f-desc" placeholder="Describe the mod..."></textarea>
        </div>
        <div class="form-row">
          <div class="field">
            <label>Tag</label>
            <select class="inp" id="f-tag"><option>Addon</option><option>VIP</option><option>New</option><option>Pass</option></select>
          </div>
          <div class="field">
            <label>Section</label>
            <select class="inp" id="f-section" onchange="togglePrice()">
              <option value="addons">Add-ons (Free)</option>
              <option value="pass-free">Pass (Free)</option>
              <option value="pass-paid">Pass (Paid ⭐)</option>
            </select>
          </div>
        </div>
        <div class="field" id="price-field" style="display:none">
          <label>Price (Stars ⭐)</label>
          <input class="inp" id="f-price" type="number" placeholder="e.g. 20" min="1">
        </div>
        <div class="field">
          <label>Cover Image *</label>
          <div style="border:2px dashed var(--border);border-radius:10px;padding:22px 14px;text-align:center;cursor:pointer" id="zone-img" onclick="document.getElementById('inp-img').click()">
            <div style="font-size:30px">🖼️</div>
            <p id="img-lbl" style="color:var(--muted);font-size:14px;margin-top:6px">Click to upload image</p>
            <input type="file" id="inp-img" accept="image/*" style="display:none" onchange="handleImg(this)">
          </div>
          <img class="img-preview" id="img-preview" src="" alt="">
        </div>
        <div class="field">
          <label>Download Link *</label>
          <input class="inp" id="f-link" type="url" placeholder="https://www.mediafire.com/...">
        </div>
        <div class="status-bar" id="add-status"></div>
        <button class="btn" id="add-btn" onclick="addMod()">⚡ ADD MOD</button>
      </div>
    </div>
    <div class="section" id="sec-settings">
      <div class="settings-box">
        <h2>SETTINGS</h2>
        <div class="field">
          <label>Worker API URL</label>
          <input class="inp" id="s-api" placeholder="https://your-worker.workers.dev">
        </div>
        <div class="field">
          <label>API Secret</label>
          <input class="inp" id="s-secret" type="password" placeholder="mcfrom_api_2026">
        </div>
        <div class="field">
          <label>Telegram Chat ID (for image storage)</label>
          <input class="inp" id="s-chatid" placeholder="-1001234567890">
          <p style="font-size:12px;color:var(--muted);margin-top:4px">Create a private channel, add your bot as admin, and paste the Chat ID here</p>
        </div>
        <button class="btn" onclick="saveSettings()">💾 SAVE SETTINGS</button>
        <button class="btn" onclick="testAPI()" style="background:transparent;border:1px solid var(--border);color:var(--muted);margin-top:-8px">🔌 Test API</button>
      </div>
    </div>
  </div>
</div>

<div class="overlay" id="edit-modal">
  <div class="modal">
    <h3>✏️ EDIT MOD</h3>
    <input type="hidden" id="edit-id">
    <div class="field"><label>Name</label><input class="inp" id="edit-name"></div>
    <div class="field"><label>Description</label><textarea class="inp" id="edit-desc"></textarea></div>
    <div class="field"><label>Image URL</label><input class="inp" id="edit-img"></div>
    <div class="field"><label>Download Link</label><input class="inp" id="edit-link"></div>
    <div class="status-bar" id="edit-status"></div>
    <div class="modal-actions">
      <button class="btn" style="background:transparent;border:1px solid var(--border);color:var(--muted)" onclick="closeModal()">Cancel</button>
      <button class="btn" onclick="saveEdit()">💾 Save</button>
    </div>
  </div>
</div>

<div class="overlay" id="del-modal">
  <div class="modal">
    <h3>🗑️ DELETE MOD?</h3>
    <input type="hidden" id="del-id">
    <div class="modal-actions">
      <button class="btn" style="background:transparent;border:1px solid var(--border);color:var(--muted)" onclick="closeModal()">Cancel</button>
      <button class="btn" style="background:var(--red);color:#fff" onclick="confirmDelete()">🗑️ Delete</button>
    </div>
  </div>
</div>

<div class="loading-overlay" id="loading-overlay"><div class="loading-spinner">⏳ Processing...</div></div>
<div id="toast"></div>

<script>
// ✅ API URL ثابت — لا يتغير
const API_BASE = "https://mcfrom-bot.8ppai2.workers.dev";
const DEFAULT_PW = "mcfrom2026";
let MODS = [], PASS_MODS = [], FEATURED_ID = null;
let settings = { api: API_BASE, secret: "mcfrom_api_2026", chatId: "" };

const $ = id => document.getElementById(id);
const toast = (msg, err=false) => {
  const t = document.createElement('div'); t.className = 'toast-item' + (err?' err':''); t.textContent = msg;
  $('toast').appendChild(t); setTimeout(() => t.remove(), 3500);
};
const showStatus = (id, msg, err=false) => { const el = $(id); el.textContent = msg; el.className = 'status-bar show' + (err?' err':''); };
const hideStatus = id => { $(id).className = 'status-bar'; };
const showLoading = () => $('loading-overlay').classList.add('show');
const hideLoading = () => $('loading-overlay').classList.remove('show');

// ✅ دالة لإصلاح روابط الصور
function fixImageUrl(url) {
  if (!url) return '';
  if (url.startsWith('http')) return url;
  if (url.startsWith('/cdn/')) return API_BASE + url;
  return url;
}

function doLogin() {
  const pw = $('pw-input').value;
  const stored = localStorage.getItem('mcfrom_pw') || DEFAULT_PW;
  if (pw === stored) {
    $('login').classList.add('hide'); $('app').classList.add('show');
    loadSettings(); loadMods();
  } else {
    $('login-err').classList.add('show'); $('pw-input').value = '';
    setTimeout(() => $('login-err').classList.remove('show'), 2000);
  }
}
function logout() { $('login').classList.remove('hide'); $('app').classList.remove('show'); $('pw-input').value = ''; }
function loadSettings() {
  const s = JSON.parse(localStorage.getItem('mcfrom_settings') || '{}');
  if (s.api) settings.api = s.api; else settings.api = API_BASE;
  if (s.secret) settings.secret = s.secret; if (s.chatId) settings.chatId = s.chatId;
  $('s-api').value = settings.api; $('s-secret').value = settings.secret; $('s-chatid').value = settings.chatId;
}
function saveSettings() {
  settings.api = $('s-api').value.trim() || API_BASE;
  settings.secret = $('s-secret').value.trim() || settings.secret;
  settings.chatId = $('s-chatid').value.trim() || settings.chatId;
  const np = $('s-newpw').value.trim();
  if (np) { localStorage.setItem('mcfrom_pw', np); $('s-newpw').value=''; toast('🔒 Password changed!'); }
  localStorage.setItem('mcfrom_settings', JSON.stringify(settings));
  toast('💾 Settings saved!');
}
function showTab(id, el) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('on'));
  document.querySelectorAll('.section').forEach(s => s.classList.remove('on'));
  el.classList.add('on'); $('sec-' + id).classList.add('on');
}
function togglePrice() { $('price-field').style.display = $('f-section').value === 'pass-paid' ? 'flex' : 'none'; }

async function apiFetch(path, method='GET', body=null) {
  const opts = { method, headers: { 'Content-Type':'application/json', 'X-API-Secret': settings.secret } };
  if (body) opts.body = JSON.stringify(body);
  const res = await fetch(API_BASE + path, opts);
  return res.json();
}

async function testAPI() {
  try { showLoading(); const data = await apiFetch('/api/mods'); hideLoading();
    if (data.addons !== undefined) toast('✅ API OK! ' + (data.addons.length + data.pass.length) + ' mods');
    else toast('❌ API Error', true);
  } catch(e) { hideLoading(); toast('❌ ' + e.message, true); }
}

async function loadMods() {
  try { showLoading(); const data = await apiFetch('/api/mods'); hideLoading();
    MODS = data.addons || []; PASS_MODS = data.pass || []; FEATURED_ID = data.featured || null; renderAll();
  } catch(e) { hideLoading(); toast('❌ Failed to load', true); renderAll(); }
}

function renderAll() {
  renderGrid('addons', MODS); renderGrid('pass', PASS_MODS);
  $('stat-mods').textContent = MODS.length;
}

function renderGrid(sec, list) {
  const g = $('grid-' + sec);
  if (!list?.length) { g.innerHTML = '<div class="empty"><p>No mods yet.</p></div>'; return; }

  g.innerHTML = list.map(m => {
    const imgUrl = fixImageUrl(m.img_url);
    return `
    <div class="mod-card">
      <img class="mod-card-img" src="${imgUrl}" alt="${m.name}" onerror="this.style.height='60px';this.src=''">
      <div class="mod-card-body">
        <div class="mod-card-name">${m.name}</div>
        <div class="mod-card-meta">
          <span class="tag">${m.tag || 'Addon'}</span>
          ${m.price ? `<span class="tag" style="border-color:var(--gold);color:var(--gold)">⭐ ${m.price}</span>` : ''}
        </div>
        <div class="mod-actions">
          <div class="ic-btn" onclick="openEdit('${m.id}')">✏️</div>
          <div class="ic-btn del" onclick="openDelete('${m.id}')">🗑️</div>
        </div>
      </div>
    </div>
  `}).join('');
}

let coverData = null;
let currentFileId = null;

function handleImg(inp) {
  const f = inp.files[0]; if(!f) return;
  const r = new FileReader();
  r.onload = e => { coverData = e.target.result; $('img-lbl').textContent = '✅ ' + f.name; $('zone-img').style.borderColor = 'var(--ac)'; const p = $('img-preview'); p.src = coverData; p.classList.add('show'); };
  r.readAsDataURL(f);
}

async function addMod() {
  const name = $('f-name').value.trim(), desc = $('f-desc').value.trim(), tag = $('f-tag').value;
  const section = $('f-section').value, price = $('f-price').value, link = $('f-link').value.trim();
  if (!name) { toast('❌ Name required', true); return; }
  if (!coverData) { toast('❌ Cover image required', true); return; }
  if (!link) { toast('❌ Download link required', true); return; }
  if (!settings.chatId) { toast('❌ Add Telegram Chat ID in Settings first!', true); return; }

  $('add-btn').disabled = true; showStatus('add-status', '⏳ Uploading image to Telegram...'); showLoading();
  try {
    const uploadRes = await apiFetch('/api/upload-telegram', 'POST', { imgB64: coverData, filename: name.replace(/[^a-zA-Z0-9]/g,'_').toLowerCase() + '.png' });
    if (!uploadRes.success) throw new Error(uploadRes.error || 'Upload failed');

    const img_url = uploadRes.img_url;
    currentFileId = uploadRes.file_id;

    // ✅ إصلاح الرابط ليكون كامل
    const fullImgUrl = fixImageUrl(img_url);

    showStatus('add-status', '⏳ Saving to database...');
    const res = await apiFetch('/api/mods', 'POST', { 
      name, desc, tag, section, 
      img_url: fullImgUrl, 
      telegram_file_id: currentFileId,
      link, 
      price: section==='pass-paid' ? (price||'20') : null 
    });
    hideLoading();
    if (res.success) {
      showStatus('add-status', '✅ Mod added!'); toast('✅ ' + name + ' added!');
      ['f-name','f-desc','f-price','f-link'].forEach(id => $(id).value='');
      $('img-preview').classList.remove('show'); $('img-lbl').textContent='Click to upload image'; $('zone-img').style.borderColor=''; coverData=null; currentFileId=null;
      await loadMods();
    } else { showStatus('add-status', '❌ ' + (res.error||'Failed'), true); }
  } catch(e) { hideLoading(); showStatus('add-status', '❌ ' + e.message, true); toast('❌ ' + e.message, true); }
  $('add-btn').disabled = false;
}

function openEdit(id) {
  const mod = [...MODS, ...PASS_MODS].find(m => m.id === id); if (!mod) return;
  $('edit-id').value = id; $('edit-name').value = mod.name; $('edit-desc').value = mod.desc || '';
  $('edit-img').value = mod.img_url || ''; $('edit-link').value = mod.link || '';
  $('edit-modal').classList.add('show');
}
async function saveEdit() {
  const id = $('edit-id').value;
  showLoading(); showStatus('edit-status', '⏳ Saving...');
  try {
    const res = await apiFetch(`/api/mods/${id}`, 'PUT', { name: $('edit-name').value.trim(), desc: $('edit-desc').value.trim(), img_url: $('edit-img').value.trim(), link: $('edit-link').value.trim() });
    hideLoading(); if (res.success) { closeModal(); toast('✅ Updated!'); await loadMods(); }
    else showStatus('edit-status', '❌ Failed', true);
  } catch(e) { hideLoading(); showStatus('edit-status', '❌ ' + e.message, true); }
}
function openDelete(id) { $('del-id').value = id; $('del-modal').classList.add('show'); }
async function confirmDelete() {
  const id = $('del-id').value; showLoading();
  try { await apiFetch(`/api/mods/${id}`, 'DELETE'); hideLoading(); closeModal(); toast('🗑️ Deleted'); await loadMods(); }
  catch(e) { hideLoading(); toast('❌ ' + e.message, true); }
}
function closeModal() { document.querySelectorAll('.overlay').forEach(o => o.classList.remove('show')); }
</script>
</body>
</html>
